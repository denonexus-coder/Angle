name: ANGLE Android ARMv8.0 build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-arm64-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      DEPOT_TOOLS_UPDATE: "0"
      DEPOT_TOOLS_METRICS: "0"
      GCLIENT_PY3: "1"
      DEBIAN_FRONTEND: "noninteractive"

    steps:

      - name: Check out ANGLE
        uses: actions/checkout@v4
        with:
          path: angle
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bison ccache curl flex git \
            libasound2-dev libdrm-dev libglib2.0-dev \
            libnss3-dev libpulse-dev libspeechd-dev \
            libx11-xcb-dev libxcomposite-dev libxcursor-dev \
            libxdamage-dev libxi-dev libxrandr-dev \
            libxshmfence-dev libxtst-dev ninja-build \
            pkg-config python3 python3-pip \
            unzip zip file binutils lsb-release

      - name: Bootstrap depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/depot_tools"

          for i in 1 2 3; do
            git clone \
              --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools" && break
            echo "Retry $i..."
            sleep 15
          done

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          export PATH="$HOME/depot_tools:$PATH"

          command -v gclient
          gclient --version

      - name: Sync ANGLE dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "angle",
              "url": "https://github.com/denocraftplayerg-max/angle.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          EOF

          gclient sync \
            --force \
            --no-history \
            --revision "angle@${GITHUB_SHA}"

      - name: Install build deps + runhooks
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          if [ -f ./angle/build/install-build-deps.sh ]; then
            sudo ./angle/build/install-build-deps.sh --no-prompt
          fi

          gclient runhooks

      - name: Verify GN
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          "$HOME/depot_tools/ensure_bootstrap"

          command -v gn
          gn --version

      - name: Force pure ARMv8.0 codegen
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("angle/build/config/android/BUILD.gn"),
              Path("angle/build/config/compiler/BUILD.gn"),
              Path("angle/build/config/arm.gni"),
          ]

          patched = False

          for path in candidates:
              if not path.exists():
                  print(f"skip missing: {path}")
                  continue

              text = path.read_text(encoding="utf-8", errors="replace")
              original = text

              if path == Path("angle/build/config/android/BUILD.gn"):
                  marker = "  asmflags = cflags\n"
                  addition = """  if (current_cpu == "arm64") {
                    cflags += [
                      "-march=armv8-a",
                      "-mtune=generic",
                      "-mno-outline-atomics",
                    ]
                  }
                  asmflags = cflags
                  """
                  if marker in text and "-mno-outline-atomics" not in text:
                      text = text.replace(marker, addition, 1)

              if path.name == "arm.gni":
                  text = re.sub(r'arm_arch\s*=\s*"[^"]*"', 'arm_arch = "armv8-a"', text)
                  text = re.sub(r'arm_use_crc\s*=\s*true', 'arm_use_crc = false', text)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  patched = True
                  print(f"patched: {path}")

          if patched:
              print("ARMv8.0 patches applied")
          else:
              print("No source patch required; GN flags will enforce ARMv8.0")
          PY

- name: Generate ARMv8.0 GN build
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"
          "$HOME/depot_tools/ensure_bootstrap"

          mkdir -p out/AndroidArmv8

          cat > out/AndroidArmv8/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"

          is_debug = false
          symbol_level = 0

          android32_ndk_api_level = 26
          android64_ndk_api_level = 26

          arm_control_flow_integrity = "none"
          use_thin_lto = false
          is_cfi = false
          use_remoteexec = false

          angle_assert_always_on = false
          angle_build_tests = false

          angle_enable_vulkan = true
          angle_enable_gl = false

          extra_cflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]
          extra_cxxflags = [
            "-march=armv8-a",
            "-mtune=generic",
            "-mno-outline-atomics",
          ]
          extra_asmflags = [
            "-march=armv8-a",
          ]
          EOF

          gn gen out/AndroidArmv8

          echo "GN generation successful."
          ls -lah out/AndroidArmv8/

      - name: Discover ANGLE targets
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          autoninja \
            -C out/AndroidArmv8 \
            -t targets \
            > /tmp/angle-targets.txt

          echo "===== ANGLE TARGETS ====="
          grep -Ei 'angle|egl|gles|library|apk' /tmp/angle-targets.txt | head -300 || true

      - name: Build ANGLE libraries and APK
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          TARGETS="$(cat /tmp/angle-targets.txt)"

          if grep -q '^angle_chromium_apk' <<< "$TARGETS"; then
            autoninja -C out/AndroidArmv8 angle_chromium_apk
          elif grep -q '^AngleLibraries' <<< "$TARGETS"; then
            autoninja -C out/AndroidArmv8 AngleLibraries
          elif grep -q '^libEGL$' <<< "$TARGETS"; then
            autoninja -C out/AndroidArmv8 libEGL libGLESv2 libGLESv1_CM
          elif grep -q '^libEGL_angle' <<< "$TARGETS"; then
            autoninja -C out/AndroidArmv8 libEGL_angle libGLESv2_angle
          else
            echo "No known ANGLE library target found."
            echo "Available targets:"
            cat /tmp/angle-targets.txt
            exit 1
          fi

      - name: Build available static ANGLE libraries
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          grep -Ei '(^|/)(angle|egl|gles|lib).*(_static|static|library)' \
            /tmp/angle-targets.txt > /tmp/static-targets.txt || true

          echo "===== POSSIBLE STATIC TARGETS ====="
          cat /tmp/static-targets.txt || true

          while IFS= read -r target; do
            [ -z "$target" ] && continue
            echo
            echo "Attempting static target: $target"
            autoninja -C out/AndroidArmv8 "$target" \
              || echo "Static target unavailable: $target"
          done < /tmp/static-targets.txt

      - name: Collect .so and .a
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/angle-package
          mkdir -p \
            /tmp/angle-package/arm64-v8a/shared \
            /tmp/angle-package/arm64-v8a/static \
            /tmp/angle-package/arm64-v8a/apk

          find out/AndroidArmv8 -type f -name '*.so' -print0 |
          while IFS= read -r -d '' file; do
            echo "SO: $file"
            cp -v "$file" "/tmp/angle-package/arm64-v8a/shared/"
          done

          find out/AndroidArmv8 -type f -name '*.a' -print0 |
          while IFS= read -r -d '' file; do
            echo "A: $file"
            cp -v "$file" "/tmp/angle-package/arm64-v8a/static/"
          done

          while IFS= read -r -d '' apk; do
            APK_NAME="$(basename "$apk" .apk)"
            mkdir -p "/tmp/angle-package/arm64-v8a/apk/$APK_NAME"
            echo "Extracting: $apk"
            unzip -o "$apk" '*.so' \
              -d "/tmp/angle-package/arm64-v8a/apk/$APK_NAME/" || true
          done < <(find out/AndroidArmv8 -type f -name '*.apk' -print0)

          echo
          echo "===== SHARED LIBRARIES ====="
          find /tmp/angle-package/arm64-v8a/shared -type f -name '*.so' -print

          echo
          echo "===== STATIC LIBRARIES ====="
          find /tmp/angle-package/arm64-v8a/static -type f -name '*.a' -print

          echo
          echo "===== PACKAGE ====="
          find /tmp/angle-package -type f -print

          test -n "$(
            find /tmp/angle-package -type f \( -name '*.so' -o -name '*.a' \) -print -quit
          )"

      - name: Verify ARM64 ELF libraries
        shell: bash
        run: |
          set -euxo pipefail

          while IFS= read -r -d '' lib; do
            echo
            echo "===== VERIFY ====="
            echo "$lib"
            file "$lib"
            file "$lib" | grep -E 'ELF 64-bit.*(ARM aarch64|aarch64)'
          done < <(find /tmp/angle-package -type f -name '*.so' -print0)

      - name: Verify ARMv8.0 instruction set
        working-directory: ${{ github.workspace }}/angle
        shell: bash
        run: |
          set -euxo pipefail

          OBJDUMP="$(command -v llvm-objdump || true)"

          if [ -z "$OBJDUMP" ]; then
            OBJDUMP="$(
              find third_party/llvm-build \
                -type f -name llvm-objdump -perm -111 \
                2>/dev/null | head -1 || true
            )"
          fi

          if [ -z "$OBJDUMP" ] || [ ! -x "$OBJDUMP" ]; then
            echo "llvm-objdump unavailable. Skipping instruction-level verification."
            exit 0
          fi

          echo "Using: $OBJDUMP"

          while IFS= read -r -d '' lib; do
            echo
            echo "Checking: $lib"
            DIS="$lib.dis"
            "$OBJDUMP" -d "$lib" > "$DIS" || true

            if grep -Eiq \
              '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve)\b' \
              "$DIS"; then
              echo "ERROR: ARMv8.1+ instruction detected: $lib"
              grep -Ei \
                '\b(ldadd|ldclr|ldeor|ldset|swp|casp|cas|stadd|stclr|steor|stset|crc32|crc32c|fcmla|fmlal|sdot|udot|bfmmla|sve)\b' \
                "$DIS" | head -50
              exit 1
            fi

            rm -f "$DIS"
            echo "ARMv8.0 OK: $lib"
          done < <(find /tmp/angle-package -type f -name '*.so' -print0)

      - name: Create maximum-compression ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp/angle-package
          zip -9 -X -r "$GITHUB_WORKSPACE/angle-arm64-v8a.zip" arm64-v8a/

          cd "$GITHUB_WORKSPACE"
          echo
          echo "===== FINAL ZIP ====="
          ls -lh angle-arm64-v8a.zip

          echo
          echo "===== ZIP CONTENT ====="
          unzip -l angle-arm64-v8a.zip

      - name: Upload ANGLE ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: angle-arm64-armv8-0
          if-no-files-found: error
          compression-level: 0
          path: angle-arm64-v8a.zip
